<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <title>Prijava / Registracija</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-kratki">
        <nav>
            <ul>
                <li><a href="index.html">Početna stranica</a></li>
                <li><a href="pronadi_inspiraciju.html">Pronađi inspiraciju</a></li>
                <li><a href="proizvodi.html">Proizvodi</a></li>
                <li id="nav-auth"><a href="login.html">Prijava</a></li>
            </ul>
        </nav>

        <section>
            <article class="container1">
                <h1>Dobrodošli</h1>
                <h3>Prijavite se ili napravite novi račun</h3>
            </article>
        </section>
    </header>

    <main>
        <section class="auth-sekcija">
            <article class="auth-kartica">
                <div class="auth-tabovi">
                    <button type="button" id="tab-prijava" class="auth-tab aktivan">Prijava</button>
                    <button type="button" id="tab-registracija" class="auth-tab">Registracija</button>
                </div>

                <!-- FORMA PRIJAVE -->
                <form id="form-prijava" class="auth-forma" style="display:flex;">
                    <label for="prijava-email">E-mail</label>
                    <input type="email" id="prijava-email" placeholder="vas@email.com" required>

                    <label for="prijava-lozinka">Lozinka</label>
                    <input type="password" id="prijava-lozinka" placeholder="Lozinka" required>

                    <a href="#" id="zaboravljena-lozinka" class="auth-link-manji">Zaboravili ste lozinku?</a>

                    <button type="submit">Prijavi se</button>
                </form>

                <!-- FORMA REGISTRACIJE -->
                <form id="form-registracija" class="auth-forma" style="display:none;">
                    <label for="reg-ime">Ime</label>
                    <input type="text" id="reg-ime" placeholder="Ime" required>

                    <label for="reg-prezime">Prezime</label>
                    <input type="text" id="reg-prezime" placeholder="Prezime" required>

                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" placeholder="vas@email.com" required>

                    <label for="reg-lozinka">Lozinka</label>
                    <input type="password" id="reg-lozinka" placeholder="Najmanje 6 znakova" required>

                    <button type="submit">Registriraj se</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>Potražite nas na društvenim mrežama</p>
        <a href="https://www.instagram.com/glassofhappinesscandles?igsh=d2c0dTgyaGFseGd2">
            <img src="slike/Instagram_icon.png" alt="Instagram logo" width="30"></a>
        <a href="https://www.tiktok.com/@glassofhappinessc?_r=1&_t=ZN-96HNe2hvFmI">
            <img src="slike/TikTok_icon.png" alt="TikTok logo" width="30"></a>
    </footer>

    <script src="js/firebase-config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
